  <line x1="0" y1="320" x2="260" y2="320" stroke="#6AAAC8" stroke-width="2.5" stroke-linecap="round" opacity="0.14"/>
  <polyline points="260,320 272,308 284,320" fill="none" stroke="#6AAAC8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.14"/>
  <polyline points="284,320 292,332 298,272 304,352 312,320" fill="none" stroke="#6AAAC8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.14"/>
  <polyline points="312,320 328,320 334,334 340,278 346,356 354,320" fill="none" stroke="#6AAAC8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.14"/>
