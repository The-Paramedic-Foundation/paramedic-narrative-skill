    <line x1="92"  y1="228" x2="248" y2="228" stroke="#0E2D42" stroke-width="7" stroke-linecap="round"/>
    <line x1="92"  y1="256" x2="248" y2="256" stroke="#0E2D42" stroke-width="7" stroke-linecap="round"/>
    <line x1="92"  y1="284" x2="248" y2="284" stroke="#0E2D42" stroke-width="7" stroke-linecap="round"/>
    <line x1="92"  y1="312" x2="200" y2="312" stroke="#0E2D42" stroke-width="7" stroke-linecap="round"/>
    <line x1="20"  y1="196" x2="86"  y2="196" stroke="#1B7EA6" stroke-width="5.5" stroke-linecap="round"/>
    <polyline points="86,196 96,184 106,196" fill="none" stroke="#1B7EA6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
