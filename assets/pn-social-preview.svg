  <!-- Wordmark: textLength constrains to exact pixel budget, gentle expansion only -->
  <text x="390" y="308"
        font-family="Arial Black, Arial, sans-serif"
        font-size="56" font-weight="900"
        textLength="760" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#0E2D42">PARAMEDIC-</tspan><tspan fill="#1B7EA6">NARRATIVE</tspan>
  </text>

  <!-- Subtitle -->
  <text x="392" y="370"
        font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="400"
        fill="#6B8CA0">by The Paramedic Foundation.</text>

  <!-- Version strip -->
  <text x="640" y="578"
        font-family="Arial, sans-serif"
        font-size="16" fill="#6AAAC8"
        text-anchor="middle" letter-spacing="1.5">
